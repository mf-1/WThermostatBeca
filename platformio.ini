; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp01_1m

[env:esp01_1m]
platform = espressif8266@4.0.1
board = esp01_1m
framework = arduino
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m.ld
upload_resetmethod = nodemcu
upload_speed = 921600
extra_scripts = pre:scripts/embed_web.py
lib_deps =
    https://github.com/mf-1/WAdapter.git#v1.38-mf.1
    ESP8266WiFi
    https://github.com/me-no-dev/ESPAsyncWebServer.git#f71e3d427b5be9791a8a2c93cf8079792c3a9a26
    https://github.com/me-no-dev/ESPAsyncTCP.git#15476867dcbab906c0f1d47a7f63cdde223abeab
    ESP8266mDNS
    PubSubClient
    DNSServer
    EEPROM
    Time
    Hash

; Upload via web interface of a device already running this firmware:
; pio run -e ota -t upload --upload-port <device_ip>
[env:ota]
extends = env:esp01_1m
upload_protocol = custom
upload_command = curl -sS -F "update=@$SOURCE" http://$UPLOAD_PORT/firmware | grep -q "Update successful" && echo "Update successful, device restarts" || (echo "Update failed"; exit 1)
